# A closed pull request -- merged or not -- takes its pre-release "pr-<number>"
# (pr-release.yml) and that release's tag with it. pull_request_target, so that
# one from a fork can too: it runs as this repository's, from master, and
# never checks out the pull request's code.
name: Pull request cleanup

on:
  pull_request_target:
    types: [closed]

jobs:
  delete-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete "pr-<number>"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: gh release delete "pr-$NUMBER" --yes --cleanup-tag || true
