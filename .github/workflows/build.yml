# Builds the editor for Windows and Linux on every push to master and on every
# pull request, and runs the tests (tests/) on Linux. A push to master also
# puts both up for download as the release "latest" -- replaced each time, so
# it is always the newest commit's. The links stay the same:
#   https://github.com/kovarex/kovarex_go_editor/releases/latest/download/kovarex_go_editor.exe
#   https://github.com/kovarex/kovarex_go_editor/releases/latest/download/kovarex_go_editor-linux-x64.tar.gz
# A pull request gets a pre-release of its own, "pr-<number>", replaced on each
# push to it and deleted when it is closed (pr-cleanup.yml), so it can be tried
# before it is merged. A comment on the pull request links to it.
name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# One run at a time for each branch or pull request: a push while an older run
# is still going -- a release being published, or a pull request being built --
# replaces it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # FASTBuild is in the repository; build.cmd finds Visual Studio and the
      # Windows SDK the runner has.
      - name: Build
        shell: cmd
        run: fastbuild\build.cmd Release -noprogress
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/Release/kovarex_go_editor.exe
          if-no-files-found: error

  linux:
    # The oldest Ubuntu GitHub offers, so the program runs on anything with a
    # glibc at least as new as 22.04's.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install what GLFW needs
        run: |
          # Ubuntu 22.04's own g++ is 12, which Agui's constexpr trips up; 13
          # comes from the toolchain PPA. (CMakeLists.txt links its runtime in,
          # so the program still runs where only 22.04's is installed.)
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config g++-13 libx11-dev libxrandr-dev libxinerama-dev \
                                  libxcursor-dev libxi-dev libgl1-mesa-dev xvfb libgl1-mesa-dri
      - name: Build
        env:
          CXX: g++-13
          CC: gcc-13
        run: |
          cmake -S . -B build/linux -DCMAKE_BUILD_TYPE=Release
          cmake --build build/linux -j "$(nproc)" 2>&1 | tee build.log
          [ "${PIPESTATUS[0]}" -eq 0 ] || exit 1
          strip build/linux/kovarex_go_editor
      # The compiler's errors on the run's page, without opening the log.
      - name: Show the errors
        if: failure()
        run: grep -E "error" build.log | head -n 30 | sed 's/^/::error::/'
      # The tests click through the editor in its own window: here on a
      # virtual screen, drawn by Mesa's software OpenGL.
      - name: Test
        run: xvfb-run -a -s "-screen 0 1920x1080x24" build/linux/kovarex_go_editor_tests --no-colors
      # A tarball rather than the bare file, which would lose being executable.
      - name: Pack
        run: tar -czf kovarex_go_editor-linux-x64.tar.gz -C build/linux kovarex_go_editor
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: kovarex_go_editor-linux-x64.tar.gz
          if-no-files-found: error

  release:
    # A pull request has its own pre-release instead (pr-release below).
    if: github.event_name != 'pull_request'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish as "latest"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Through the environment, not pasted into the script, where a quote
          # in it would break the script.
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest kovarex_go_editor.exe kovarex_go_editor-linux-x64.tar.gz \
            --target "$GITHUB_SHA" --latest \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}: $(printf '%s' "$MESSAGE" | head -n 1)

          **Windows:** kovarex_go_editor.exe -- download and run.
          **Linux (x64):** kovarex_go_editor-linux-x64.tar.gz -- \`tar -xzf kovarex_go_editor-linux-x64.tar.gz && ./kovarex_go_editor\`"

  pr-release:
    # Only for pull requests from this repository: one from a fork gets no
    # token that could publish.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish as "pr-<number>"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          # Through the environment, not pasted into the script, where a quote
          # in it would break the script.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          tag="pr-$NUMBER"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" kovarex_go_editor.exe kovarex_go_editor-linux-x64.tar.gz \
            --target "$SHA" --prerelease --latest=false \
            --title "Pull request #$NUMBER: $TITLE" \
            --notes "Built from ${SHA::7}, the newest commit of #$NUMBER. Deleted when the pull request is closed.

          **Windows:** kovarex_go_editor.exe -- download and run.
          **Linux (x64):** kovarex_go_editor-linux-x64.tar.gz -- \`tar -xzf kovarex_go_editor-linux-x64.tar.gz && ./kovarex_go_editor\`"
      - name: Link to it from the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # One comment, found again by its first line and updated on each push.
          marker="<!-- pr-release -->"
          base="https://github.com/$GH_REPO/releases/download/pr-$NUMBER"
          body="$marker
          **Try this pull request** (built from ${SHA::7}):
          - Windows: [kovarex_go_editor.exe]($base/kovarex_go_editor.exe)
          - Linux (x64): [kovarex_go_editor-linux-x64.tar.gz]($base/kovarex_go_editor-linux-x64.tar.gz)"
          id="$(gh api "repos/$GH_REPO/issues/$NUMBER/comments" --paginate \
                  --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$GH_REPO/issues/$NUMBER/comments" -f body="$body" > /dev/null
          fi
